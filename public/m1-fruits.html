<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruits ม.1</title><style>body{font:18px system-ui;background:#f5f5dc;color:#254b3c;margin:20px auto;max-width:720px;padding:12px}fieldset{background:white;border:1px solid #c8d9cf;border-radius:12px;margin:18px 0;padding:15px}label{display:block;padding:12px;border-bottom:1px solid #eee}button{background:#176047;color:white;border:0;border-radius:9px;padding:14px;font:inherit}a{color:#176047}</style><a href="/">← กลับหน้าหลัก</a><h1>🍉 Fruits — คำศัพท์ผลไม้</h1><p>ม.1 · 5 ข้อ · ผ่าน 3/5 คะแนน</p><p id="status">กำลังโหลด…</p><form id="quiz"></form><div id="result"></div><script>
const choices=[['Pineapple','Papaya','Watermelon','Rambutan'],['แตงโม','มะละกอ','สับปะรด','เงาะ'],['Rambutan','Papaya','Strawberry','Lime'],['เงาะ','สับปะรด','แตงโม','มะนาว'],['Papaya and Pineapple','Rambutan and Pineapple','Rambutan and Watermelon','Strawberry and Pineapple']];
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function call(url,opts){const r=await fetch(url,{credentials:'same-origin',...opts});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||d.message||'เกิดข้อผิดพลาด');return d}
(async()=>{try{const d=await call('/api/school?route=secondary-exercise-paper&key=m1-fruits-vocabulary');document.querySelector('#status').textContent='เลือกคำตอบที่ถูกต้องแล้วกดส่งตรวจ';const f=document.querySelector('#quiz');f.innerHTML=d.questions.map((q,i)=>'<fieldset><legend>ข้อ '+(i+1)+' · '+esc(q.prompt.split(' A. ')[0])+'</legend>'+choices[i].map((c,j)=>'<label><input type="radio" required name="q'+i+'" value="'+esc(c)+'"> '+String.fromCharCode(65+j)+'. '+esc(c)+'</label>').join('')+'</fieldset>').join('')+'<button>ส่งตรวจและบันทึกคะแนน</button>';f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const answers=d.questions.map((q,i)=>f.querySelector('input[name=q'+i+']:checked').value);const r=await call('/api/school?route=secondary-exercise-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_key:'m1-fruits-vocabulary',answers})});document.querySelector('#result').innerHTML='<h2>คะแนน '+r.correct_count+'/'+r.total_count+' — '+(r.correct_count>=3?'ผ่าน ✓':'ไม่ผ่าน ✗')+'</h2>'+r.feedback.map(x=>'<p>ข้อ '+x.question_no+' '+(x.is_correct?'✓':'✗')+' เฉลย: '+esc(x.answer)+'</p>').join('');document.querySelector('#status').textContent='บันทึกคะแนนแล้ว';}catch(err){b.disabled=false;document.querySelector('#status').textContent='ส่งไม่สำเร็จ: '+err.message}}}catch(err){document.querySelector('#status').textContent='เปิดไม่ได้: '+err.message}})();
</script></html>
