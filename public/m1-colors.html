<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colors · ม.1 · Nathoeng School</title><link rel="stylesheet" href="/style.css"><style>body{background:#f5f5dc;color:#193e35;font-family:system-ui,sans-serif}main{max-width:820px;margin:24px auto;padding:20px}.card{background:white;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 2px 8px #0001}label{display:block;padding:9px;cursor:pointer}button{padding:12px 24px;border:0;border-radius:9px;background:#193e35;color:white;font-size:1rem}button:disabled{opacity:.5}#status{padding:12px}small{color:#555}</style></head><body><main><a href="/#secondary/m1">← กลับไป ม.1</a><h1>Colors – สีทั้ง 7 สี</h1><p>ภาษาอังกฤษ ม.1 · 10 ข้อ · ผ่าน 6 คะแนนขึ้นไป</p><form id="quiz"></form><p id="status" role="status"></p><section id="result" aria-live="polite"></section></main><script>
const questions=[
["What color is a ripe banana?","กล้วยสุกมีสีอะไร?",["Red","Green","Yellow","Blue"],2,"Yellow หมายถึง สีเหลือง"],
["What color is grass?","หญ้ามีสีอะไร?",["Blue","Green","Orange","Violet"],1,"Green หมายถึง สีเขียว"],
["What color is a ripe tomato?","มะเขือเทศสุกมีสีอะไร?",["Red","Orange","Indigo","Yellow"],0,"Red หมายถึง สีแดง"],
["What color is an orange?","ผลส้มมีสีอะไร?",["Green","Yellow","Red","Orange"],3,"Orange หมายถึง สีส้ม"],
["What color is the clear sky?","ท้องฟ้าแจ่มใสมีสีอะไร?",["Violet","Blue","Red","Green"],1,"Blue หมายถึง สีน้ำเงินหรือสีฟ้า"],
["What is the English word for สีคราม?","คำภาษาอังกฤษของสีครามคืออะไร?",["Blue","Violet","Indigo","Green"],2,"Indigo หมายถึง สีคราม"],
["What is the English word for สีม่วง?","คำภาษาอังกฤษของสีม่วงคืออะไร?",["Orange","Indigo","Blue","Violet"],3,"Violet หมายถึง สีม่วง"],
["Which color comes after yellow in a rainbow?","สีใดอยู่ถัดจากสีเหลืองในรุ้งกินน้ำ?",["Green","Blue","Orange","Indigo"],0,"ลำดับสีรุ้งหลัง Yellow คือ Green"],
["Which color comes between blue and violet in a rainbow?","สีใดอยู่ระหว่างสีน้ำเงินและสีม่วงในรุ้งกินน้ำ?",["Green","Orange","Indigo","Yellow"],2,"Indigo อยู่ระหว่าง Blue และ Violet"],
["Which sequence shows the seven rainbow colors in the correct order?","ข้อใดเรียงสีรุ้งทั้ง 7 สีได้ถูกต้อง?",["Red, Yellow, Orange, Green, Blue, Indigo, Violet","Red, Orange, Yellow, Green, Blue, Indigo, Violet","Red, Orange, Green, Yellow, Blue, Violet, Indigo","Orange, Red, Yellow, Green, Indigo, Blue, Violet"],1,"เรียงตามลำดับ Red, Orange, Yellow, Green, Blue, Indigo, Violet"]
];
const form=document.querySelector('#quiz'),status=document.querySelector('#status'),result=document.querySelector('#result');
form.innerHTML=questions.map((q,i)=>'<section class="card"><strong>'+(i+1)+'. '+q[0]+'</strong><p><small>'+q[1]+'</small></p>'+q[2].map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'" required> '+String.fromCharCode(65+j)+'. '+a+'</label>').join('')+'</section>').join('')+'<button id="send" type="submit">ส่งคำตอบและตรวจคะแนน</button>';
let submissionId=null,locked=false;
form.addEventListener('submit',async e=>{e.preventDefault();if(locked)return;const answers=questions.map((_,i)=>{const v=form.querySelector('input[name="q'+i+'"]:checked');return v?Number(v.value):null});if(answers.some(x=>x===null)){status.textContent='กรุณาตอบทุกข้อก่อนส่ง';return;}submissionId ||= crypto.randomUUID();const btn=document.querySelector('#send');btn.disabled=true;status.textContent='กำลังบันทึกคะแนน กรุณารอสักครู่…';try{const response=await fetch('/api/school?route=m1-colors-submit',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers,submission_id:submissionId})});const data=await response.json();if(!response.ok||!data.success)throw Error(data.message||data.error||'ไม่สามารถบันทึกคะแนนได้');locked=true;status.textContent='บันทึกคะแนนสำเร็จ';result.innerHTML='<section class="card"><h2>คะแนน '+data.item.correct_count+'/10 — '+(data.passed?'ผ่าน':'ไม่ผ่าน')+'</h2>'+data.item.feedback.map((f,i)=>'<p><strong>ข้อ '+(i+1)+': '+(f.is_correct?'✓ ถูก':'✗ ผิด')+'</strong> — '+questions[i][4]+'</p>').join('')+'</section>';form.querySelectorAll('input').forEach(x=>x.disabled=true);}catch(err){status.textContent='ยังบันทึกไม่สำเร็จ: '+err.message+' — คำตอบยังอยู่ กดส่งซ้ำได้';btn.disabled=false;}});
</script></body></html>
