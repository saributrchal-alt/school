<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby Animals · ม.1 · Nathoeng School</title><link rel="stylesheet" href="/style.css"><style>body{background:#f5f5dc;color:#193e35;font-family:system-ui,sans-serif}main{max-width:820px;margin:24px auto;padding:20px}.card{background:white;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 2px 8px #0001}label{display:block;padding:9px;cursor:pointer}button{padding:12px 24px;border:0;border-radius:9px;background:#193e35;color:white;font-size:1rem}button:disabled{opacity:.5}#status{padding:12px}small{color:#555}</style></head><body><main><a href="/#secondary/m1">← กลับไป ม.1</a><h1>Baby Animals – ลูกสัตว์</h1><p>ภาษาอังกฤษ ม.1 · 10 ข้อ · ผ่าน 6 คะแนนขึ้นไป</p><form id="quiz"></form><p id="status" role="status"></p><section id="result" aria-live="polite"></section></main><script>
const questions=[["What is a baby cow called?","ลูกวัวภาษาอังกฤษเรียกว่าอะไร?",["Calf","Kid","Foal","Lamb"],0,"Calf = ลูกวัว"],["What is a baby goat called?","ลูกแพะภาษาอังกฤษเรียกว่าอะไร?",["Cub","Kid","Chick","Calf"],1,"Kid = ลูกแพะ"],["What is a baby sheep called?","ลูกแกะภาษาอังกฤษเรียกว่าอะไร?",["Foal","Puppy","Lamb","Kitten"],2,"Lamb = ลูกแกะ"],["What is a baby horse called?","ลูกม้าภาษาอังกฤษเรียกว่าอะไร?",["Calf","Cub","Kid","Foal"],3,"Foal = ลูกม้า"],["What is a baby dog called?","ลูกสุนัขภาษาอังกฤษเรียกว่าอะไร?",["Puppy","Kitten","Duckling","Chick"],0,"Puppy = ลูกสุนัข"],["What is a baby cat called?","ลูกแมวภาษาอังกฤษเรียกว่าอะไร?",["Cub","Kitten","Lamb","Foal"],1,"Kitten = ลูกแมว"],["What is a baby duck called?","ลูกเป็ดภาษาอังกฤษเรียกว่าอะไร?",["Chick","Puppy","Duckling","Calf"],2,"Duckling = ลูกเป็ด"],["What is a baby chicken called?","ลูกไก่ภาษาอังกฤษเรียกว่าอะไร?",["Kid","Cub","Foal","Chick"],3,"Chick = ลูกไก่"],["What is a baby lion called?","ลูกสิงโตภาษาอังกฤษเรียกว่าอะไร?",["Cub","Lamb","Calf","Duckling"],0,"Cub = ลูกสิงโต"],["What is a baby pig called?","ลูกหมูภาษาอังกฤษเรียกว่าอะไร?",["Puppy","Piglet","Kitten","Foal"],1,"Piglet = ลูกหมู"]];
const form=document.querySelector('#quiz'),status=document.querySelector('#status'),result=document.querySelector('#result');
form.innerHTML=questions.map((q,i)=>'<section class="card"><strong>'+(i+1)+'. '+q[0]+'</strong><p><small>'+q[1]+'</small></p>'+q[2].map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'" required> '+String.fromCharCode(65+j)+'. '+a+'</label>').join('')+'</section>').join('')+'<button id="send" type="submit">ส่งคำตอบและตรวจคะแนน</button>';
let submissionId=null,locked=false;
form.addEventListener('submit',async e=>{e.preventDefault();if(locked)return;const answers=questions.map((_,i)=>{const v=form.querySelector('input[name="q'+i+'"]:checked');return v?Number(v.value):null});if(answers.some(x=>x===null)){status.textContent='กรุณาตอบทุกข้อก่อนส่ง';return;}submissionId ||= crypto.randomUUID();const btn=document.querySelector('#send');btn.disabled=true;status.textContent='กำลังบันทึกคะแนน กรุณารอสักครู่…';try{const response=await fetch('/api/school?route=m1-baby-animals-submit',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers,submission_id:submissionId})});const data=await response.json();if(!response.ok||!data.success)throw Error(data.message||data.error||'ไม่สามารถบันทึกคะแนนได้');locked=true;status.textContent='บันทึกคะแนนสำเร็จ';result.innerHTML='<section class="card"><h2>คะแนน '+data.item.correct_count+'/10 — '+(data.passed?'ผ่าน':'ไม่ผ่าน')+'</h2>'+data.item.feedback.map((f,i)=>'<p><strong>ข้อ '+(i+1)+': '+(f.is_correct?'✓ ถูก':'✗ ผิด')+'</strong> — '+questions[i][4]+'</p>').join('')+'</section>';form.querySelectorAll('input').forEach(x=>x.disabled=true);}catch(err){status.textContent='ยังบันทึกไม่สำเร็จ: '+err.message+' — คำตอบยังอยู่ กดส่งซ้ำได้';btn.disabled=false;}});
</script></body></html>
