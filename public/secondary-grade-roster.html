<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดชั้นเรียนนักเรียน | Nathoeng School</title><style>body{margin:0;background:#f4f8f5;color:#173d31;font:16px system-ui}main{max-width:940px;margin:24px auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #1231}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;border:1px solid #b8cabc;border-radius:8px;padding:9px}button{background:#195d46;color:white;cursor:pointer}button:disabled{opacity:.5}input{flex:1;min-width:180px}a{color:#195d46}.error{color:#a22}.muted{color:#65776d}.student{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #e3eae4}.student strong{flex:1;min-width:170px}</style></head><body><main><a href="/secondary-assignment-reports.html">← กลับศูนย์ตรวจการบ้าน</a><h1>🏫 จัดนักเรียนเข้าชั้น ม.1–ม.6</h1><p>สำหรับ Admin เท่านั้น · บันทึกการเปลี่ยนระดับชั้นในระบบ School</p><section class="card"><div class="row"><input id="search" placeholder="ค้นหาชื่อนักเรียน" aria-label="ค้นหาชื่อนักเรียน"><select id="filter"><option value="">ทุกระดับชั้น</option><option value="0">ยังไม่จัดชั้น</option><option value="1">ม.1</option><option value="2">ม.2</option><option value="3">ม.3</option><option value="4">ม.4</option><option value="5">ม.5</option><option value="6">ม.6</option></select><button id="reload">รีเฟรช</button></div><p id="status" aria-live="polite">กำลังโหลด…</p><div id="students"></div></section></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let students=[];
async function api(url,opts){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opts});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||d.message||'ทำรายการไม่สำเร็จ');return d}
function render(){const term=$('search').value.toLowerCase().trim(),filter=$('filter').value;const visible=students.filter(s=>s.member_name.toLowerCase().includes(term)&&(filter===''||Number(filter)===(s.grade||0)));$('students').innerHTML=visible.map(s=>'<div class="student"><strong>'+esc(s.member_name)+'</strong><span class="muted">'+(s.grade?'ม.'+s.grade:'ยังไม่จัดชั้น')+'</span><select aria-label="ระดับชั้นของ '+esc(s.member_name)+'" data-id="'+esc(s.member_id)+'"><option value="">เลือกระดับชั้น</option>'+Array.from({length:6},(_,i)=>'<option value="'+(i+1)+'" '+(s.grade===i+1?'selected':'')+'>ม.'+(i+1)+'</option>').join('')+'</select><button data-save="'+esc(s.member_id)+'">บันทึก</button></div>').join('')||'<p>ไม่พบนักเรียน</p>'}
async function load(){$('status').textContent='กำลังโหลดรายชื่อ…';try{const d=await api('/api/school?route=secondary-grade-candidates');students=d.students||[];$('status').textContent='นักเรียนทั้งหมด '+students.length+' คน · ยังไม่จัดชั้น '+students.filter(s=>!s.grade).length+' คน'+(d.truncated?' · แสดงไม่ครบ 1,000 รายการ':'');render()}catch(e){$('status').textContent=e.message;$('status').className='error'}}
$('students').onclick=async e=>{const b=e.target.closest('button[data-save]');if(!b)return;const id=b.dataset.save;const select=[...$('students').querySelectorAll('select[data-id]')].find(x=>x.dataset.id===id);const grade=Number(select?.value);if(!grade){$('status').textContent='กรุณาเลือกระดับชั้น';return}b.disabled=true;try{await api('/api/school?route=secondary-grade-assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({member_id:id,grade})});const student=students.find(s=>s.member_id===id);if(student)student.grade=grade;$('status').textContent='บันทึกชั้นเรียนสำเร็จ';render()}catch(err){$('status').textContent=err.message;b.disabled=false}};
$('search').oninput=render;$('filter').onchange=render;$('reload').onclick=load;load();
</script></body></html>
