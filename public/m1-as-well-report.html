<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายงาน As Well | Nathoeng School</title><style>body{font:16px system-ui;background:#f4f7f4;color:#153b2e}main{max-width:960px;margin:30px auto;padding:16px}article{background:white;padding:20px;margin:14px 0;border-radius:14px;box-shadow:0 2px 10px #1231}a{color:#165f44}summary{cursor:pointer}small{color:#61766c}</style><main><a href="/">← กลับ School</a><h1>รายงานการบ้าน ม.1 — Using “As Well”</h1><p>เฉพาะครูและผู้ดูแล · คะแนนล่าสุดและข้อที่ตอบผิด</p><div id="result">กำลังโหลดรายงาน…</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{try{const r=await fetch('/api/school?route=m1-as-well-results',{credentials:'same-origin'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||d.message||'ไม่มีสิทธิ์เข้าถึง');const students=d.students||[];document.getElementById('result').innerHTML='<article><b>นักเรียน '+students.length+' คน · ส่งแล้ว '+students.filter(s=>s.latest).length+' คน</b></article>'+students.map(s=>'<article><h3>'+esc(s.member_name)+'</h3><p>ส่ง '+s.attempt_count+' ครั้ง · '+(s.latest?'<b>คะแนนล่าสุด '+s.latest.correct_count+'/'+s.latest.total_count+'</b> · '+new Date(s.latest.submitted_at).toLocaleString('th-TH'):'ยังไม่ส่ง')+'</p>'+(s.latest?'<details><summary>ดูข้อที่ตอบผิด ('+s.latest.wrong_answers.length+')</summary>'+s.latest.wrong_answers.map(q=>'<p>ข้อ '+q.question_no+' · ตอบ: '+esc(q.selected_answer||'ไม่ตอบ')+' · เฉลย: '+esc(q.answer)+'</p>').join('')+'</details>':'')+'</article>').join('')+(d.truncated?'<p>รายงานจำกัดประวัติ 1,000 ครั้งล่าสุด</p>':'')}catch(e){document.getElementById('result').textContent='เปิดรายงานไม่ได้: '+e.message}})()</script></html>
