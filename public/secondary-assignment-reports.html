<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์ตรวจการบ้าน | Nathoeng School</title><style>
:root{font-family:system-ui,sans-serif;color:#153c30;background:#f5f8f5}body{margin:0}main{max-width:960px;margin:24px auto;padding:16px}a{color:#176448}h1{font-size:clamp(25px,5vw,38px)}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #1231}button,select{font:inherit;padding:10px 14px;border-radius:9px;border:1px solid #b8cbc0}button{background:#195d46;color:white;cursor:pointer}.secondary{background:#fff;color:#195d46}summary{cursor:pointer;font-weight:600}small{color:#526c5e}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.muted{color:#586e62}.error{color:#a12d25}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #e0e8e2}@media(max-width:600px){table{font-size:13px}}
</style></head><body><main><a href="/">← กลับ School</a><h1>📋 ศูนย์ตรวจการบ้านและแบบฝึกหัด</h1><p>สำหรับครูและผู้ดูแล · มัธยมศึกษาปีที่ 1–6</p><div class="row"><label for="grade">ระดับชั้น</label><select id="grade"><option value="1">มัธยมศึกษาปีที่ 1</option><option value="2">มัธยมศึกษาปีที่ 2</option><option value="3">มัธยมศึกษาปีที่ 3</option><option value="4">มัธยมศึกษาปีที่ 4</option><option value="5">มัธยมศึกษาปีที่ 5</option><option value="6">มัธยมศึกษาปีที่ 6</option></select><button id="refresh">รีเฟรช</button></div><div id="list" aria-live="polite"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=document.getElementById('list'),grade=document.getElementById('grade');
const q=new URLSearchParams(location.search);if(/^[1-6]$/.test(q.get('grade')||''))grade.value=q.get('grade');
async function get(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||d.message||'โหลดข้อมูลไม่สำเร็จ');return d}
async function load(){list.textContent='กำลังโหลดรายการแบบฝึกหัด…';history.replaceState(null,'','?grade='+grade.value);try{const d=await get('/api/school?route=secondary-assignments&grade='+grade.value);if(!d.assignments.length){list.innerHTML='<section class="card">ยังไม่มีแบบฝึกหัดที่เชื่อมรายงานในระดับชั้นนี้</section>';return}list.innerHTML=d.assignments.map(a=>'<section class="card"><div class="row"><div style="flex:1"><strong>'+esc(a.title)+'</strong><br><small>'+esc(a.subject)+'</small></div><button data-key="'+esc(a.assignment_key)+'">ตรวจรายงาน</button></div><div id="report-'+esc(a.assignment_key)+'"></div></section>').join('')}catch(e){list.innerHTML='<section class="card error">'+esc(e.message)+'</section>'}}
async function report(key){const target=document.getElementById('report-'+key);if(!target)return;target.textContent='กำลังโหลดคะแนน…';try{const d=await get('/api/school?route=secondary-assignment-results&key='+encodeURIComponent(key));const students=d.students||[];const submitted=students.filter(s=>s.latest);const avg=submitted.length?(submitted.reduce((n,s)=>n+100*s.latest.correct_count/Math.max(1,s.latest.total_count),0)/submitted.length).toFixed(1):'-';target.innerHTML='<p class="muted">นักเรียน '+students.length+' คน · ส่งแล้ว '+submitted.length+' คน · ยังไม่ส่ง '+(students.length-submitted.length)+' คน · คะแนนเฉลี่ย '+avg+'%</p><div style="overflow-x:auto"><table><thead><tr><th>นักเรียน</th><th>สถานะ</th><th>คะแนนล่าสุด</th><th>ประวัติ</th></tr></thead><tbody>'+students.map(s=>'<tr><td>'+esc(s.member_name)+'</td><td>'+(s.latest?'ส่งแล้ว':'ยังไม่ส่ง')+'</td><td>'+(s.latest?esc(s.latest.correct_count)+'/'+esc(s.latest.total_count):'-')+'</td><td>'+(s.latest?'<details><summary>ดูข้อผิด · ส่ง '+esc(s.attempt_count)+' ครั้ง</summary><small>'+esc(new Date(s.latest.submitted_at).toLocaleString('th-TH'))+'</small>'+(s.latest.wrong_answers||[]).map(w=>'<p>ข้อ '+esc(w.question_no)+' · ตอบ '+esc(w.selected_answer||'ไม่ตอบ')+' · เฉลย '+esc(w.answer)+'</p>').join('')+'</details>':'-')+'</td></tr>').join('')+'</tbody></table></div>'+(d.truncated?'<p class="muted">แสดงข้อมูลจากประวัติ 1,000 ครั้งล่าสุด</p>':'')}catch(e){target.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
list.addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(b)report(b.dataset.key)});grade.addEventListener('change',load);document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
