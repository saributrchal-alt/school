<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Days, Months and Seasons | School Nathoeng</title><style>body{font:16px system-ui,sans-serif;background:#f4f8f5;color:#163d30;margin:0}main{max-width:800px;margin:24px auto;padding:16px}.card{background:white;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 2px 12px #1231}.q{border-top:1px solid #dce9e0;padding:15px 0}label{display:block;padding:8px}button{background:#185c43;color:white;border:0;border-radius:9px;padding:13px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:#185c43}.ok{color:#147244}.bad{color:#b32323}.muted{color:#587164}</style></head><body><main><a href="/">← กลับ School</a><section class="card"><h1>Days, Months and Seasons</h1><p>ภาษาอังกฤษ ม.1 · วัน เดือน และฤดูกาล · 10 ข้อ</p><p class="muted">ได้มากกว่า 5 คะแนนจึงผ่าน · ส่งคำตอบแล้วแจ้งผลให้ผู้เรียนและศูนย์ตรวจงานของครู</p></section><section class="card" id="paper">กำลังโหลดข้อสอบ…</section><section class="card" id="result" aria-live="polite">ยังไม่ได้ส่งคำตอบ</section></main><script>
const KEY='m1-days-months-seasons';
const options=[['Sunday','Tuesday','Wednesday','Thursday'],['Friday','Monday','Saturday','Sunday'],['Wensday','Wednsday','Wendesday','Wednesday'],['February','May','April','June'],['September','December','November','October'],['10 months','11 months','12 months','13 months'],['Spring','Summer','Autumn','Winter'],['Hot season','Rainy season','Cool season','Dry season'],['True','False'],['True','False']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
async function request(url,opts){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opts});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||d.message||'ไม่สำเร็จ');return d}
(async()=>{const paper=document.getElementById('paper'),result=document.getElementById('result');try{const d=await request('/api/school?route=secondary-exercise-paper&key='+KEY);if(d.questions.length!==10)throw Error('จำนวนข้อสอบไม่ถูกต้อง');paper.innerHTML='<form id="quiz">'+d.questions.map((q,i)=>'<div class="q"><strong>ข้อ '+(i+1)+'. '+esc(q.prompt)+'</strong>'+options[i].map((o,j)=>'<label><input required type="radio" name="q'+i+'" value="'+esc(o)+'"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join('')+'</div>').join('')+'<button type="submit">ส่งคำตอบและตรวจคะแนน</button></form>';document.getElementById('quiz').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button');button.disabled=true;result.textContent='กำลังตรวจและบันทึกผล…';try{const answers=options.map((_,i)=>form.querySelector('input[name="q'+i+'"]:checked').value);const r=await request('/api/school?route=secondary-exercise-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_key:KEY,answers})});const passed=r.correct_count>r.total_count/2;result.innerHTML='<h2 class="'+(passed?'ok':'bad')+'">'+(passed?'🎉 สอบผ่าน':'สอบไม่ผ่าน')+'</h2><h3>คะแนน '+r.correct_count+'/'+r.total_count+' ('+Math.round(r.correct_count/r.total_count*100)+'%)</h3><p>บันทึกผลแล้ว ครูสามารถตรวจผลจากศูนย์ตรวจการบ้านได้</p>'+r.feedback.map(x=>'<p>ข้อ '+esc(x.question_no)+' '+(x.is_correct?'✓ ถูก':'✗ ผิด')+' · เฉลย '+esc(x.answer)+'<br>'+esc(x.explanation)+'</p>').join('');form.querySelectorAll('input').forEach(x=>x.disabled=true);result.scrollIntoView({behavior:'smooth'})}catch(err){result.textContent='ยังไม่บันทึกคะแนน: '+err.message;button.disabled=false}}}catch(err){paper.textContent='ไม่สามารถเปิดแบบฝึกหัด: '+err.message}})();
</script></body></html>
