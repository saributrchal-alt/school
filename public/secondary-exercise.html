<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบฝึกหัดมัธยม | Nathoeng School</title><style>body{font:16px system-ui;background:#f4f8f5;color:#174332;margin:0}main{max-width:820px;margin:24px auto;padding:16px}.card{background:#fff;padding:20px;margin:15px 0;border-radius:14px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #afc7b7;border-radius:8px;box-sizing:border-box}input,textarea{width:100%;margin:5px 0 14px}button{background:#195c46;color:white;cursor:pointer}a{color:#195c46}.error{color:#a22}.row{display:flex;gap:12px;flex-wrap:wrap}label{display:block;margin-top:10px}</style><main><a href="/">← กลับ School</a><h1>แบบฝึกหัด ม.1–ม.6</h1><div class="card"><h2>ค้นหาแบบฝึกหัดตามระดับชั้น</h2><label>เลือกระดับชั้น<select id="browse-grade"><option value="1">ม.1</option><option value="2">ม.2</option><option value="3">ม.3</option><option value="4">ม.4</option><option value="5">ม.5</option><option value="6">ม.6</option></select></label><button id="browse">แสดงแบบฝึกหัด</button><div id="browse-results"></div></div><div id="student" class="card"><label>รหัสแบบฝึกหัด<input id="key" placeholder="เช่น m2-english-lesson1"></label><button id="open">เปิดแบบฝึกหัด</button><div id="paper"></div></div><div class="card"><h2>สร้างแบบฝึกหัดใหม่ (Admin)</h2><p>ระบบจะเพิ่มรายการเข้าศูนย์ตรวจการบ้านของระดับชั้นที่เลือกโดยอัตโนมัติ</p><label>ชั้นเรียน<select id="grade"><option value="1">ม.1</option><option value="2">ม.2</option><option value="3">ม.3</option><option value="4">ม.4</option><option value="5">ม.5</option><option value="6">ม.6</option></select></label><label>วิชา<input id="subject" placeholder="ภาษาอังกฤษ"></label><label>ชื่อแบบฝึกหัด<input id="title" placeholder="Unit 1"></label><label>รหัสไม่ซ้ำ (a-z, 0-9, -)<input id="newkey" placeholder="m2-english-unit1"></label><label>คำถามและเฉลย (JSON array)<textarea id="questions" rows="9" spellcheck="false">[{"prompt":"I like tea ___ .","answer":"as well","explanation":"as well หมายถึง ด้วยเช่นกัน"}]</textarea></label><button id="create">สร้างและลงทะเบียน</button><p id="create-status" aria-live="polite"></p></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,opts){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opts});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||d.message||'ไม่สำเร็จ');return d}
const q=new URLSearchParams(location.search);if(q.get('key')){$('key').value=q.get('key');setTimeout(()=>$('open').click(),0)}
$('browse').onclick=async()=>{const box=$('browse-results');box.textContent='กำลังโหลด…';try{const d=await request('/api/school?route=secondary-exercise-list&grade='+$('browse-grade').value);box.innerHTML=d.assignments.length?d.assignments.map(a=>'<p>'+(a.assignment_key==='m1-days-months-seasons'?'<a href="/m1-days-months-seasons.html">'+esc(a.subject)+' — '+esc(a.title)+' (ทำข้อสอบ)</a>':'<button data-open-key="'+esc(a.assignment_key)+'">'+esc(a.subject)+' — '+esc(a.title)+'</button>')+'</p>').join(''):'<p>ยังไม่มีแบบฝึกหัดในชั้นนี้</p>'}catch(err){box.textContent=err.message}};$('browse-results').onclick=e=>{const b=e.target.closest('button[data-open-key]');if(b){$('key').value=b.dataset.openKey;$('open').click();$('student').scrollIntoView({behavior:'smooth'})}};
$('open').onclick=async()=>{const box=$('paper');box.textContent='กำลังโหลด…';try{const key=$('key').value.trim(),d=await request('/api/school?route=secondary-exercise-paper&key='+encodeURIComponent(key));box.innerHTML='<h2>'+esc(d.assignment.title)+'</h2><p>'+esc(d.assignment.subject)+' · ม.'+esc(d.assignment.grade)+'</p><form id="answers">'+d.questions.map(x=>'<label>ข้อ '+esc(x.question_no)+' · '+esc(x.prompt)+'<input name="answer" required maxlength="500"></label>').join('')+'<button type="submit">ส่งตรวจ</button></form><div id="feedback"></div>';const form=$('answers');form.onsubmit=async e=>{e.preventDefault();try{const answers=[...form.querySelectorAll('input[name=answer]')].map(x=>x.value);const result=await request('/api/school?route=secondary-exercise-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_key:key,answers})});$('feedback').innerHTML='<h3>คะแนน '+result.correct_count+'/'+result.total_count+'</h3>'+result.feedback.map(x=>'<p>ข้อ '+esc(x.question_no)+' '+(x.is_correct?'✓ ถูก':'✗ ผิด')+' · เฉลย: '+esc(x.answer)+'<br>'+esc(x.explanation)+'</p>').join('');form.querySelector('button').disabled=true}catch(err){$('feedback').textContent=err.message}}}catch(err){box.innerHTML='<p class="error">'+esc(err.message)+'</p>'}};
$('create').onclick=async()=>{const status=$('create-status');status.textContent='กำลังสร้าง…';try{const questions=JSON.parse($('questions').value);const payload={grade:Number($('grade').value),subject:$('subject').value,title:$('title').value,assignment_key:$('newkey').value,questions};const d=await request('/api/school?route=secondary-exercise-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});status.innerHTML='สร้างสำเร็จ · '+d.question_count+' ข้อ · <a href="/secondary-assignment-reports.html?grade='+payload.grade+'">ตรวจรายงาน</a> · <a href="?key='+encodeURIComponent(d.assignment_key)+'">เปิดแบบฝึก</a>'}catch(err){status.textContent=err.message;status.className='error'}};
</script></html>
